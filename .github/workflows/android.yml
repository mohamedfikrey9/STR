name: Build Android Debug APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"

      - name: Install Godot 4.4.1 and export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: '4.4.1'
          use-dotnet: false
          include-templates: true

      - name: Generate debug signing key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android" build
          keytool -genkeypair -noprompt \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=StealTheRule,C=US"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$HOME/.android/debug.keystore" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> "$GITHUB_ENV"

      - name: Import project and initialize Godot editor settings
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --editor --import --quit

      - name: Run gameplay smoke tests
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --script res://tests/smoke.gd

      - name: Capture actual rendered menu and arena
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/screenshots
          xvfb-run -a godot --path . --script res://tests/visual.gd
          test -s build/screenshots/menu.png
          test -s build/screenshots/arena.png

      - name: Upload visual test screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: StealTheRule-Visual-Test
          path: build/screenshots/
          if-no-files-found: warn

      - name: Configure Godot Android SDK paths
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path
          settings = Path.home() / '.config/godot/editor_settings-4.4.tres'
          settings.parent.mkdir(parents=True, exist_ok=True)
          if settings.exists():
              content = settings.read_text()
          else:
              content = '[gd_resource type="EditorSettings" format=3]\n\n[resource]\n'
          if '[resource]' not in content:
              raise RuntimeError('Unexpected Godot editor settings format')
          keys = {
              'export/android/android_sdk_path': os.environ['ANDROID_SDK_ROOT'],
              'export/android/java_sdk_path': os.environ['JAVA_HOME'],
          }
          lines = [line for line in content.splitlines() if not any(line.startswith(k + ' =') for k in keys)]
          content = '\n'.join(lines).rstrip() + '\n'
          for key, value in keys.items():
              content += f'{key} = "{value}"\n'
          settings.write_text(content)
          print('Configured Godot Android SDK and Java paths')
          PY

      - name: Configure signing in export preset
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path
          p = Path('export_presets.cfg')
          s = p.read_text()
          keystore = str(Path.home() / '.android/debug.keystore')
          assert Path(keystore).is_file(), 'Debug keystore missing'
          s = s.replace('keystore/debug=""', 'keystore/debug="' + keystore + '"')
          s = s.replace('keystore/debug_user=""', 'keystore/debug_user="androiddebugkey"')
          s = s.replace('keystore/debug_password=""', 'keystore/debug_password="android"')
          p.write_text(s)
          PY
          godot --headless --path . --editor --quit

      - name: Diagnose Android export configuration
        shell: bash
        run: |
          set -euo pipefail
          echo "Godot settings:"
          ls -la "$HOME/.config/godot"/editor_settings* || true
          grep -E 'export/android/(android_sdk_path|java_sdk_path)' "$HOME/.config/godot/editor_settings-4.4.tres" || true
          echo "Installed SDK packages:"
          ls -ld "$ANDROID_SDK_ROOT/platforms/android-35" "$ANDROID_SDK_ROOT/build-tools/35.0.0"
          echo "Export templates:"
          find "$HOME/.local/share/godot/export_templates" -maxdepth 2 -type f -name 'android_debug.apk' -print || true

      - name: Validate Android export preset
        shell: bash
        run: |
          set -euo pipefail
          test -f project.godot
          test -f export_presets.cfg
          grep -q 'name="Android"' export_presets.cfg
          mkdir -p build

      - name: Export Android debug APK
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --verbose --path . --export-debug "Android" "build/StealTheRule.apk"

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          test -s build/StealTheRule.apk
          ls -lh build/StealTheRule.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: StealTheRule-Debug-APK
          path: build/StealTheRule.apk
          if-no-files-found: error
