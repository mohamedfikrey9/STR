
name: Build Android Debug APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        shell: bash
        run: |
          set -e
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Install Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: '4.4.1'
          use-dotnet: false
          include-templates: true

      - name: Prepare debug signing
        shell: bash
        run: |
          mkdir -p "$HOME/.android" build
          keytool -genkeypair \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=StealTheRule,C=US"

          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"


      - name: Configure Godot Android paths
        shell: bash
        run: |
          set -e
          mkdir -p "$HOME/.config/godot"
          SETTINGS="$HOME/.config/godot/editor_settings-4.tres"

          if [ ! -f "$SETTINGS" ]; then
            printf '[gd_resource type="EditorSettings" format=3]\n\n[resource]\n' > "$SETTINGS"
          fi

          python3 - <<'PY'
          import os
          from pathlib import Path

          p = Path.home() / ".config/godot/editor_settings-4.tres"
          text = p.read_text()
          sdk = os.environ["ANDROID_SDK_ROOT"]
          java = os.environ["JAVA_HOME"]

          entries = {
              "export/android/android_sdk_path": sdk,
              "export/android/java_sdk_path": java,
          }

          for key, value in entries.items():
              lines = [
                  line for line in text.splitlines()
                  if not line.startswith(key + " =")
              ]
              text = "\n".join(lines) + "\n"
              text += f'{key} = "{value}"\n'

          p.write_text(text)
          PY

      - name: Import Godot resources
        run: godot --headless --path . --editor --import --quit

      - name: Export Android APK
        run: |
          godot --headless --path . \
            --export-debug "Android" \
            build/StealTheRule.apk

      - name: Verify APK
        run: test -s build/StealTheRule.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: StealTheRule-Android-APK
          path: build/StealTheRule.apk
          if-no-files-found: error
